<!DOCTYPE html>
<html>
<head>
  <title>Student Form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h2>Student Details</h2>

    <form onsubmit="submitData(event)">
      <input type="text" id="name" placeholder="Name" required>
      <input type="text" id="usn" placeholder="USN" required>
      <input type="text" id="branch" placeholder="Branch" required>
      <input type="text" id="year" placeholder="Year" required>
      <input type="email" id="email" placeholder="Email" required>

      <button type="submit">Submit</button>
    </form>
  </div>

  <script>
    async function submitData(e) {
      e.preventDefault(); // prevents page reload

      const data = {
        name: document.getElementById("name").value,
        usn: document.getElementById("usn").value,
        branch: document.getElementById("branch").value,
        year: document.getElementById("year").value,
        email: document.getElementById("email").value
      };

      try {
        const res = await fetch("https://student-backend-dnnq.onrender.com/students", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        alert("✅ Submitted successfully");
        console.log(result);

      } catch (err) {
        alert("😴 Server waking... try again");
        console.log(err);
      }
    }
  </script>

</body>
</html>
