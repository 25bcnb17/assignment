<!DOCTYPE html>
<html>
<head>
  <title>Student Form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="box">
    <h3>Student Details</h3>

    <input type="text" id="name" placeholder="Name">
    <input type="text" id="usn" placeholder="USN">
    <input type="text" id="branch" placeholder="Branch">
    <input type="text" id="year" placeholder="Year">
    <input type="email" id="email" placeholder="Email">

    <button onclick="submitData()">Submit</button>
  </div>

  <!-- JS inside HTML (no path issues 🔥) -->
  <script>
    async function submitData() {
      console.log("Clicked 🔥");

      const data = {
        name: document.getElementById("name").value,
        usn: document.getElementById("usn").value,
        branch: document.getElementById("branch").value,
        year: document.getElementById("year").value,
        email: document.getElementById("email").value
      };

      try {
        const res = await fetch("https://student-backend-dnnq.onrender.com/students", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        alert("✅ Submitted successfully");
        console.log(result);

      } catch (err) {
        alert("😴 Server waking... try again");
        console.log(err);
      }
    }
  </script>

</body>
</html>
